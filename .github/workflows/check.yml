name: Check Estradot stock

on:
  schedule:
    # Runs at :07 and :37 past every hour (offset from the exact hour, since
    # GitHub's scheduler tends to be congested right at :00 and :30).
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated results back

concurrency:
  group: estradot-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run stock check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_estradot.py

      - name: Commit and push results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stock data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
